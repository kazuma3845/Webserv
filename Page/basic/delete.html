<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supprimer un fichier</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #282c34;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 800px;
            padding: 20px;
            background-color: #333;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        h1 {
            font-size: 3em;
            margin-bottom: 0.5em;
        }
        p {
            font-size: 1.2em;
            margin-bottom: 1em;
        }
        .form-container {
            background-color: #444;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        label {
            font-size: 1.2em;
            color: #ccc;
            display: block;
            margin-bottom: 10px;
        }
        input[type="file"] {
            padding: 10px;
            font-size: 1em;
            border: none;
            background-color: #555;
            color: white;
            border-radius: 5px;
        }
        input[type="file"]:focus {
            outline: none;
        }
        .delete-btn {
            display: inline-block;
            padding: 10px 20px;
            font-size: 1em;
            color: white;
            background-color: #FF6347; /* Couleur rouge foncé */
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
            cursor: pointer;
            border: none;
            margin-top: 10px;
        }
        .delete-btn:hover {
            background-color: #DC143C; /* Couleur rouge clair */
        }
        .message {
            margin-top: 20px;
            padding: 10px;
            background-color: #f2dede;
            color: #a94442;
            border-radius: 5px;
            display: none;
        }
        .file-container {
            margin-top: 20px;
            background-color: #f9f9f9;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .file-label {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .file-name {
            font-size: 0.9em;
            color: #666;
        }
    </style>
    <script>
        function deleteFile() {
            var fileInput = document.getElementById('file');
            if (!fileInput.files.length) {
                document.getElementById('error-msg').innerText = 'Veuillez choisir un fichier à supprimer.';
                document.getElementById('error-msg').style.display = 'block';
                return;
            }

            var file = fileInput.files[0];
            var filename = file.name;
            var url = '/data/' + encodeURIComponent(filename); // Remplacez par l'URL correcte pour supprimer le fichier

            fetch(url, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json'
                    // Ajoutez d'autres en-têtes si nécessaire
                }
            })
            .then(response => {
                if (response.ok) {
                    document.getElementById('success-msg').innerText = 'Le fichier a été supprimé avec succès.';
                    document.getElementById('success-msg').style.display = 'block';
                } else {
                    document.getElementById('error-msg').innerText = 'Erreur lors de la suppression du fichier.';
                    document.getElementById('error-msg').style.display = 'block';
                }
            })
            .catch(error => {
                console.error('Erreur de réseau :', error);
                document.getElementById('error-msg').innerText = 'Erreur de réseau, veuillez réessayer.';
                document.getElementById('error-msg').style.display = 'block';
            });
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>Supprimer un fichier</h1>
        <p>Choisissez un fichier à supprimer :</p>
        <div class="file-container" id="file-container">
            <label for="file" class="file-label">Choisir un fichier :</label>
            <input type="file" id="file" name="file">
        </div>
        <input type="submit" value="Supprimer le fichier" class="delete-btn" onclick="deleteFile()">
        <div id="error-msg" class="message"></div>
        <div id="success-msg" class="message"></div>
    </div>
</body>
</html>
