<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>42 WebServ - Upload and Delete File</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #282c34;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            overflow: auto;
        }
        .container {
            max-width: 800px;
            padding: 20px;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 0.5em;
        }
        p {
            font-size: 1.2em;
            margin-bottom: 1em;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            font-size: 1em;
            color: white;
            background-color: #00bfff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
            margin: 5px;
        }
        .btn:hover {
            background-color: #009acd;
        }
        .btn-red {
            background-color: #ff4d4d;
        }
        .btn-red:hover {
            background-color: #cc0000;
        }
        .logo {
            width: 150px;
            height: auto;
            margin-bottom: 1em;
        }
        footer {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 0.8em;
            color: #aaa;
        }
        input[type="file"], input[type="text"] {
            display: block;
            margin: 10px auto;
            padding: 10px;
            font-size: 1em;
        }
        label {
            cursor: pointer;
            display: inline-block;
            padding: 10px 20px;
            font-size: 1em;
            color: white;
            background-color: #00bfff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
            margin: 5px;
        }
        label:hover {
            background-color: #009acd;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/8d/42_Logo.svg" alt="42 Logo" class="logo">
        <h1>Upload and Delete File</h1>
        <p>Select a file to upload:</p>
        <input type="file" id="fileInput" />
        <label for="fileInput">Choose File</label>
        <button id="uploadButton" class="btn">Upload Selected File</button>
        <p id="uploadStatusMessage"></p>
        <hr>
        <p>Enter the name of the file to delete:</p>
        <input type="text" id="fileToDelete" placeholder="Enter file name" />
        <button id="deleteButton" class="btn btn-red">Delete File</button>
        <p id="deleteStatusMessage"></p>
        <hr>
        <button id="viewFilesButton" class="btn">View Uploaded Files</button>
    </div>
    <footer>
        &copy; 2024 42 WebServ.
    </footer>
    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadButton = document.getElementById('uploadButton');
        const uploadStatusMessage = document.getElementById('uploadStatusMessage');
        const fileToDelete = document.getElementById('fileToDelete');
        const deleteButton = document.getElementById('deleteButton');
        const deleteStatusMessage = document.getElementById('deleteStatusMessage');
        const viewFilesButton = document.getElementById('viewFilesButton');

        uploadButton.addEventListener('click', function() {
            const file = fileInput.files[0];
            if (file) {
                const xhr = new XMLHttpRequest();
                xhr.open('PUT', `/${file.name}`, true);
                xhr.onload = function() {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        uploadStatusMessage.textContent = 'File uploaded successfully!';
                    } else {
                        uploadStatusMessage.textContent = 'File upload failed!';
                    }
                };
                xhr.onerror = function() {
                    uploadStatusMessage.textContent = 'File upload failed!';
                };
                xhr.send(file);
            } else {
                uploadStatusMessage.textContent = 'Please select a file.';
            }
        });

        deleteButton.addEventListener('click', function() {
            const fileName = fileToDelete.value;
            if (fileName) {
                const xhr = new XMLHttpRequest();
                xhr.open('DELETE', `/data/${fileName}`, true);
                xhr.onload = function() {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        deleteStatusMessage.textContent = 'File deleted successfully!';
                    } else {
                        deleteStatusMessage.textContent = 'File deletion failed!';
                    }
                };
                xhr.onerror = function() {
                    deleteStatusMessage.textContent = 'File deletion failed!';
                };
                xhr.send();
            } else {
                deleteStatusMessage.textContent = 'Please enter a file name.';
            }
        });

        viewFilesButton.addEventListener('click', function() {
            window.location.href = '/data/';
        });
    </script>
</body>
</html>
