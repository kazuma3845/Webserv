<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Télécharger un fichier</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #282c34;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 800px;
            padding: 20px;
            background-color: #333;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        h1 {
            font-size: 3em;
            margin-bottom: 0.5em;
        }
        p {
            font-size: 1.2em;
            margin-bottom: 1em;
        }
        .form-container {
            background-color: #444;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        label {
            font-size: 1.2em;
            color: #ccc;
            display: block;
            margin-bottom: 10px;
        }
        input[type="file"] {
            padding: 10px;
            font-size: 1em;
            border: none;
            background-color: #555;
            color: white;
            border-radius: 5px;
        }
        input[type="file"]:focus {
            outline: none;
        }
        .upload-btn {
            display: inline-block;
            padding: 10px 20px;
            font-size: 1em;
            color: white;
            background-color: #4CAF50; /* Couleur verte */
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
            cursor: pointer;
            border: none;
            margin-top: 10px;
        }
        .upload-btn:hover {
            background-color: #45a049; /* Couleur verte foncée */
        }
        .message {
            margin-top: 20px;
            padding: 10px;
            background-color: #f2dede;
            color: #a94442;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Télécharger un fichier</h1>
        <p>Choisissez un fichier à télécharger :</p>
        <form class="form-container" method="POST" action="/cgi/upload.py" enctype="multipart/form-data">
            <label for="file" class="file-label">Choisir un fichier :</label>
            <input type="file" id="file" name="file">
            <input type="submit" value="Télécharger le fichier" class="upload-btn">
        </form>
        <div id="error-msg" class="message"></div>
        <div id="success-msg" class="message"></div>
    </div>
</body>
</html>
