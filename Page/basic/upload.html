<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload d'image</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #282c34;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 800px;
            padding: 20px;
            background-color: #333;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        h1 {
            font-size: 3em;
            margin-bottom: 0.5em;
        }
        p {
            font-size: 1.2em;
            margin-bottom: 1em;
        }
        .form-container {
            background-color: #444;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        label {
            font-size: 1.2em;
            color: #ccc;
            display: block;
            margin-bottom: 10px;
        }
        input[type="file"] {
            padding: 10px;
            font-size: 1em;
            border: none;
            background-color: #555;
            color: white;
            border-radius: 5px;
        }
        input[type="file"]:focus {
            outline: none;
        }
        .upload-btn {
            display: inline-block;
            padding: 10px 20px;
            font-size: 1em;
            color: white;
            background-color: #00bfff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
            cursor: pointer;
            border: none;
        }
        .upload-btn:hover {
            background-color: #009acd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Upload d'image</h1>
        <p>Choisissez une image à télécharger :</p>
        <div class="form-container">
            <form action="/cgi/upload_image.py" method="POST" enctype="multipart/form-data">
                <label for="image">Choisir une image :</label>
                <input type="file" id="image" name="image"><br><br>
                <input type="submit" value="Upload" class="upload-btn">
            </form>
        </div>
    </div>
</body>
</html>
