server {
    listen 8002;
	server_name webserv;
    host 127.0.0.1;

    root Page/;
    client_max_body_size 3000000;
	index index.html;
    error_page 404 Page/error/400/404.html;

    location / {
        allow_methods  DELETE POST GET;
        index page.html;
        autoindex off;
    }

    location /tours {
        autoindex on;
        index tours.html;
        allow_methods GET POST PUT HEAD;
    }

	location /red {
		return /tours;
	}

    location /cgi {
        root ./;
        allow_methods GET POST DELETE;
        index time.py;
        cgi_path /usr/bin/python3 /bin/bash;
        cgi_ext .py .sh;
    }
}
