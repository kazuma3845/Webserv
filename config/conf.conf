server {
    listen 8002;
	server_name webserv;
    host 127.0.0.1;

    root Page/;
    client_max_body_size 10000000;
    index index.html;
    error_page 404 Page/404.html;

    location / {
        allow_methods  DELETE POST GET;
        autoindex off;
    }

    location /tours {
        autoindex off;
        index tours.html;
        allow_methods GET POST PUT HEAD;
    }

    location /data {
        autoindex off;
        allow_methods GET POST DELETE ;
    }

    location /banane {
        autoindex on;
        allow_methods GET POST PUT HEAD;
    }

	location /red {
		return /tours;
        index exemple.html;
	}

    location /basic {
        autoindex on;
        allow_methods GET POST DELETE
        index hella.html
    }

    location /cgi {
        root ./;
        allow_methods GET POST DELETE;
        index time.py;
        cgi_path /usr/bin/python3 /bin/bash;
        cgi_ext .py .sh;
    }
}
