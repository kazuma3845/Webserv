server {
    listen 8001;
	server_name coucou.ch;
    host 127.0.0.1;

    root Page/;
    client_max_body_size 10000000000;
    index index.html;
    error_page 404 Page/404.html;

    location / {
        allow_methods  DELETE POST GET;
        autoindex off;
    }

    location /basic {
        autoindex off;
        allow_methods GET POST DELETE
        index hella.html
    }

    location /cgi {
        root ./;
        allow_methods GET POST DELETE;
        index time.py;
        cgi_path /usr/bin/python3 /bin/bash;
        cgi_ext .py .sh;
    }
}

server {
    listen 8002;
    listen 8003;
	server_name webserv;
    host 127.0.0.1;

    root Page/;
    client_max_body_size 10000000000;
