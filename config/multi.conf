server {
    listen 0.0.0.0:8000;
    listen 8001;
    listen 8002;
    root Page/;
    server_name weebserv;
    autoindex off;
    index index.html;
    client_max_body_size 10;

    location /cgi {
        root ./;
        allow_methods GET POST DELETE;
        index time.py;
        cgi_path /usr/bin/python3 /bin/bash;
        cgi_ext .py .sh;
    }
}

server {
	listen 0.0.0.0:8000;
	listen 8001;
	listen 8002;

	root test_us/root/el_secundo;
	server_name el_secundo;

	allow_methods GET;

	autoindex off;
	index index.html;

	client_max_body_size 10;

    location /cgi {
        root ./;
        allow_methods GET POST DELETE;
        index time.py;
        cgi_path /usr/bin/python3 /bin/bash;
        cgi_ext .py .sh;
    }
}
